<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies - Serin Baek</title>
    <link rel="icon" href="CFTR.png" type="image/png">
    <style>
        .nav-bar {
            margin-bottom: 40px;
            background: #f8f9fa;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #eaeaea;
        }
        .nav-bar a {
            text-decoration: none;
            font-size: 16px;
            color: #666;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.2s ease-in-out;
            margin: 0 4px;
        }
        .nav-bar a:hover {
            color: #000;
            background: #e9ecef;
        }
        .nav-bar a.active {
            color: #fff;
            background: #212529;
            font-weight: bold;
        }

        /* Record Player Styling */
        .turntable-container {
            background: #222;
            width: 320px;
            height: 320px;
            border-radius: 20px;
            margin: 30px auto 20px auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #444;
        }

        .vinyl {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #111 30%, #222 31%, #111 32%, #000 65%, #222 66%, #111 70%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-label {
            width: 100px;
            height: 100px;
            background: #b22222;
            border-radius: 50%;
            border: 3px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            padding: 5px;
        }

        /* Spin Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinning {
            animation: spin 3s linear infinite;
        }

        .controls {
            margin-top: 20px;
        }

        .btn-control {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            margin: 5px;
            transition: background 0.2s;
        }

        .btn-control:hover {
            background: #e2e8f0;
        }

        .cd-selector {
            margin: 20px 0;
        }

        #youtube-container {
            margin-top: 20px;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; max-width: 800px; margin: 0 auto; padding: 20px;">
    
    <!-- Navigation Menu -->
    <div class="nav-bar">
        <a href="index.html">About</a>
        <a href="bsc-thesis.html">BSc Thesis</a>
        <a href="projects.html">Projects</a>
        <a href="hobbies.html" class="active">Hobbies</a>
    </div>

    <h1 style="font-size: 32px; margin-bottom: 5px;"><strong>Classical Music Corner</strong></h1>
    <p style="color: #666; margin-bottom: 20px;">Load a CD onto the turntable to play classical tracks via YouTube.</p>

    <!-- Turntable Player -->
    <div class="turntable-container">
        <div class="vinyl" id="vinylRecord">
            <div class="vinyl-label" id="cdLabel">No CD Loaded</div>
        </div>
    </div>

    <!-- Now Playing Display -->
    <p id="nowPlaying" style="font-style: italic; color: #444; font-size: 16px; margin-bottom: 15px;">Status: Stopped</p>

    <!-- CD Selector Buttons -->
    <div class="cd-selector">
        <p style="font-weight: bold; margin-bottom: 8px;">Select a CD:</p>
        <button class="btn-control" onclick="loadCD('Hayato Sumino', 'Rachmaninov Adagio', 'OS4NsKxXGDc')">CD 1: Rachmaninov - Symphony No. 2 (Adagio)</button>
        <button class="btn-control" onclick="loadCD('Beethoven', 'Moonlight Sonata', '4Tr0otuiQuU')">CD 2: Beethoven - Moonlight Sonata</button>
        <button class="btn-control" onclick="loadCD('Chopin', 'Nocturne Op. 9 No. 2', '9E6c8y5Bqps')">CD 3: Chopin - Nocturne</button>
    </div>

    <!-- Playback Controls -->
    <div class="controls">
        <button class="btn-control" onclick="stopMusic()" style="background: #212529; color: white;">Stop Music</button>
        <button class="btn-control" onclick="playRandomCD()">🎲 Random Classical Track</button>
    </div>

    <!-- Embedded YouTube Player -->
    <div id="youtube-container">
        <iframe id="ytPlayer" width="300" height="80" src="" frameborder="0" allow="autoplay"></iframe>
    </div>

    <script>
        const vinyl = document.getElementById('vinylRecord');
        const cdLabel = document.getElementById('cdLabel');
        const nowPlaying = document.getElementById('nowPlaying');
        const ytPlayer = document.getElementById('ytPlayer');

        const cds = [
            { composer: 'Hayato Sumino', title: 'Rachmaninov Adagio', id: 'OS4NsKxXGDc' },
            { composer: 'Beethoven', title: 'Moonlight Sonata', id: '4Tr0otuiQuU' },
            { composer: 'Chopin', title: 'Nocturne Op. 9', id: '9E6c8y5Bqps' }
        ];

        function loadCD(composer, title, videoId) {
            ytPlayer.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            cdLabel.innerHTML = `${composer}<br>${title}`;
            nowPlaying.innerText = `Playing: ${composer} - ${title}`;
            vinyl.classList.add('spinning');
        }

        function stopMusic() {
            ytPlayer.src = ""; 
            vinyl.classList.remove('spinning');
            cdLabel.innerHTML = "No CD Loaded";
            nowPlaying.innerText = `Status: Stopped`;
        }

        function playRandomCD() {
            const randomIndex = Math.floor(Math.random() * cds.length);
            const selectedCD = cds[randomIndex];
            loadCD(selectedCD.composer, selectedCD.title, selectedCD.id);
        }
    </script>
</body>
</html>
